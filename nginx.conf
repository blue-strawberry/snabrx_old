server {
    listen 80;
    server_name snabrx.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name snabrx.ru;

    ssl_certificate /etc/letsencrypt/live/snabrx.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/snabrx.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location / {
        proxy_pass         http://127.0.0.1:8597;
        proxy_redirect     off;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $server_name;
    }

    # 1) GET https://mydomain.com/tgbotapi/sendMessage?text=...
    #
    #    Превращается в:
    #    https://api.telegram.org/bot<BOT_TOKEN>/sendMessage?chat_id=<HARDCODED_CHAT_ID>&text=...
    #
    #    Обратите внимание, что мы добавляем и chat_id, и передаём $query_string (чтобы text=... подставлялся)
    location = /tgbotapi/sendMessage {
        # Указываем прямой proxy_pass с query-параметрами
        proxy_pass https://api.telegram.org/bot7362521407:AAEVKpYhMCMMQ41d5Q1AovOD8v9GzOybj-I/sendMessage?chat_id=1032446520&$query_string;

        # Рекомендуется явно указать хост и включить поддержку SNI (особенно для HTTPS upstream)
        proxy_set_header Host api.telegram.org;
        proxy_ssl_server_name on;
        proxy_ssl_name api.telegram.org;
    }

    # 2) POST https://mydomain.com/tgbotapi/sendMediaGroup
    #
    #    Превращается в:
    #    https://api.telegram.org/bot<БОТ_ТОКЕН>/sendMediaGroup
    #
    #    Все тело запроса (formData) проксируется как есть.
    location = /tgbotapi/sendMediaGroup {
        proxy_pass https://api.telegram.org/bot7362521407:AAEVKpYhMCMMQ41d5Q1AovOD8v9GzOybj-I/sendMediaGroup;

        proxy_set_header Host api.telegram.org;
        proxy_ssl_server_name on;
        proxy_ssl_name api.telegram.org;
    }
}